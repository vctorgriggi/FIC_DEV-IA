<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal do Cliente - Dashboard de Vendas</title>
  <style>
    body { margin: 0; padding: 20px; background: #f4f6f8; font-family: sans-serif; }
    .card { min-height: 640px; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, .12); }
    iframe { width: 100%; height: 600px; border: 0; }
  </style>
</head>
<body>
  <main class="card">
    <h2>Relatório de Vendas</h2>
    <!-- Troque 1 pelo ID do dashboard salvo no Superset. -->
    <iframe
      src="http://localhost:8088/superset/dashboard/1/?standalone=true"
      title="Dashboard de vendas">
    </iframe>
  </main>
</body>
</html>
